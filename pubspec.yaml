name: hands
description: "Tablet hand-rehabilitation app for post-stroke Patients."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  fonts:
    # Paytone One, SIL Open Font License 1.1 (assets/fonts/PaytoneOne-OFL.txt).
    - family: PaytoneOne
      fonts:
        - asset: assets/fonts/PaytoneOne-Regular.ttf
