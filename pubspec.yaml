name: hands
description: "Tablet hand-rehabilitation app for post-stroke Patients."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  animations: ^3.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_svg: ^2.5.1
  intl: ^0.20.3
  skeletonizer: ^3.0.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The device smoke test, run with flutter drive so it can save screenshots.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  wakelock_plus_platform_interface: ^1.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
  fonts:
    # Nunito, SIL Open Font License 1.1 (assets/fonts/Nunito-OFL.txt).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
