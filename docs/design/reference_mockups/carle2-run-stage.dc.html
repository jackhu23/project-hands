<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HANDS · Run — stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00546B}a:hover{color:#003A4E}
@keyframes hands-burst{0%{transform:scale(0.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes hands-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: linear-gradient(105deg, #0A8199 0%, #00627C 45%, #003A4E 100%); font-family: Nunito, system-ui, sans-serif; color: #0B2D3C; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 104px; padding: 0 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; color: #FFFFFF">
    <div style="width: 240px; display: flex; align-items: center"><img src="../../../assets/logos/carle-health-white.png" alt="Carle Health" style="height: 30px; width: auto"></div>
    <div style="width: 420px; height: 64px; box-sizing: border-box; padding: 0 24px; border-radius: 32px; background: #FFFFFF; color: #0B2D3C; display: flex; align-items: center; gap: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.15)">
      <span style="font-size: 22px; font-weight: 900; white-space: nowrap">{{ popped }} of {{ total }}</span>
      <span style="flex-grow: 1; height: 14px; border-radius: 7px; background: #E5EBEE; display: block; overflow: hidden" aria-hidden="true"><span style="{{ barStyle }}"></span></span>
    </div>
    <div style="width: 240px; display: flex; justify-content: flex-end">
    <button onClick="{{ pause }}" aria-label="Pause" style="height: 64px; padding: 0 28px; border-radius: 32px; border: none; background: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 900; color: #003A4E; display: flex; align-items: center; gap: 10px">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="#003A4E"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="#003A4E"></rect></svg>
      Pause
    </button>
    </div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 104px; bottom: 24px; border-radius: 24px; background: radial-gradient(ellipse at 50% 50%, #FFFFFF 0%, #F3F8FA 60%, #E3EDF1 100%); box-shadow: inset 0 2px 12px rgba(0,58,78,0.12)"></div>
  <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ pop }}" aria-label="Balloon" style="{{ balloonStyle }}">
      <svg width="134" height="178" viewBox="0 0 120 160" aria-hidden="true">
        <defs><radialGradient id="bgr" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#F0566F"></stop><stop offset="0.55" stop-color="#C8102E"></stop><stop offset="1" stop-color="#8E0B21"></stop></radialGradient></defs>
        <ellipse cx="60" cy="62" rx="46" ry="56" fill="url(#bgr)"></ellipse><path d="M34 40 Q40 22 58 18" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M54 117 L60 126 L66 117 Z" fill="#8E0B21"></path><path d="M60 126 Q52 140 62 156" stroke="#3F5966" stroke-width="2" fill="none"></path>
      </svg>
    </button>
  </sc-if>
  <sc-if value="{{ showBurst }}" hint-placeholder-val="{{ false }}">
    <div style="{{ burstStyle }}" aria-hidden="true">
      <svg width="200" height="200" viewBox="0 0 200 200" style="animation: hands-burst 0.5s ease-out forwards"><circle cx="100" cy="100" r="46" fill="none" stroke="#C8102E" stroke-width="5"></circle><g stroke="#0A8199" stroke-width="6" stroke-linecap="round"><path d="M100 30v-18"></path><path d="M100 188v-18"></path><path d="M30 100h-18"></path><path d="M188 100h-18"></path><path d="M150 50l12-12"></path><path d="M38 162l12-12"></path><path d="M50 50l-12-12"></path><path d="M162 162l-12-12"></path></g></svg>
    </div>
  </sc-if>
  <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: linear-gradient(105deg, rgba(10,129,153,0.96) 0%, rgba(0,58,78,0.97) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #FFFFFF">
      <h2 style="margin: 0 0 12px; font-size: 52px; font-weight: 900">Paused</h2>
      <button onClick="{{ resume }}" style="width: 460px; height: 88px; border-radius: 12px; border: none; background: #FFFFFF; color: #003A4E; font-family: inherit; font-size: 28px; font-weight: 900">Keep going</button>
      <button onClick="{{ resume }}" style="width: 460px; height: 68px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; font-family: inherit; font-size: 21px; font-weight: 800">Watch the demo again</button>
      <a href="carle2-balloon-touch.dc.html" style="width: 460px; height: 68px; border-radius: 12px; background: #FCE4E8; color: #A50D26; text-decoration: none; font-size: 21px; font-weight: 800; display: flex; align-items: center; justify-content: center">End this run</a>
    </div>
  </sc-if>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: linear-gradient(105deg, #0A8199 0%, #00627C 45%, #003A4E 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #FFFFFF">
      <span style="height: 36px; padding: 0 18px; border-radius: 18px; background: #FCE4E8; color: #A50D26; font-size: 15px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center">RUN COMPLETE</span>
      <h2 style="margin: 0; font-size: 64px; font-weight: 900">Well done!</h2>
      <p style="margin: 0; font-size: 24px; color: #D3E8EE">You popped all {{ total }} balloons.</p>
      <div style="display: flex; gap: 16px; margin-top: 20px">
        <a href="carle2-home.dc.html" style="width: 260px; height: 80px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.6); color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center">Back to today's plan</a>
        <button onClick="{{ again }}" style="width: 260px; height: 80px; border-radius: 12px; border: none; background: #FFFFFF; color: #003A4E; font-family: inherit; font-size: 22px; font-weight: 900">Go again</button>
      </div>
      <img src="../../../assets/logos/carle-health-white.png" alt="Carle Health" style="position: absolute; bottom: 36px; height: 30px; width: auto; opacity: 0.85">
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { popped: 3, paused: false, burst: null }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const total = 10, popped = this.state.popped;
    const spots = [[575, 300], [820, 190], [300, 400], [960, 430], [430, 170], [690, 480], [180, 220], [1010, 170], [540, 500], [250, 500]];
    const s = spots[popped % spots.length];
    const done = popped >= total;
    const b = this.state.burst;
    const dots = Array.from({ length: total }, (_, i) => ({ style: 'display: block; width: 14px; height: 14px; border-radius: 7px; background: ' + (i < popped ? '#FFFFFF' : 'rgba(255,255,255,0.3)') }));
    return {
      total, popped, done, dots,
      paused: this.state.paused,
      playing: !done && !this.state.paused,
      showBurst: !!b,
      burstStyle: b ? 'position: absolute; pointer-events: none; left: ' + (b[0] - 33) + 'px; top: ' + (b[1] + 20 - 22) + 'px' : '',
      barStyle: 'display: block; height: 100%; border-radius: 7px; background: linear-gradient(90deg, #0A8199, #003A4E); width: ' + Math.round(100 * Math.min(popped, total) / total) + '%',
      balloonStyle: 'position: absolute; left: ' + s[0] + 'px; top: ' + (s[1] + 20) + 'px; border: none; background: none; padding: 0; cursor: pointer; filter: drop-shadow(0 12px 16px rgba(142,11,33,0.25)); animation: hands-float 3s ease-in-out infinite',
      pop: () => { clearTimeout(this.t); this.setState({ popped: popped + 1, burst: s }); this.t = setTimeout(() => this.setState({ burst: null }), 500); },
      pause: () => this.setState({ paused: true }),
      resume: () => this.setState({ paused: false }),
      again: () => this.setState({ popped: 0, paused: false, burst: null })
    };
  }
}
</script>
</body>
</html>
