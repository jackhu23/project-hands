name: Flutter from .fvmrc
description: Install the Flutter version pinned in .fvmrc, with SDK and pub caching.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.pin.outputs.version }}
        channel: stable
        cache: true
