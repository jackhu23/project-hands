name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its stale run; runs on main always finish so every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/flutter
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  # Proves the documented setup works from a clean checkout on every developer OS.
  setup-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install FVM (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
      - name: Install FVM (macOS)
        if: runner.os == 'macOS'
        run: brew tap leoafarias/fvm && brew install fvm
      - name: Install FVM (Windows)
        if: runner.os == 'Windows'
        run: choco install fvm -y --no-progress
      - run: fvm install
      - run: fvm flutter pub get
      - run: fvm dart run tool/setup.dart
